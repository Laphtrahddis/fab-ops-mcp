[project]
name = "fab-ops-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siddharth Pal", email = "sidd260504@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.7.4",
    "mcp>=2.3.0",
    "onnxruntime==1.20.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
]

[project.scripts]
fab-ops-mcp = "fab_ops_mcp:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

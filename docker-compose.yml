services:
  db:
    image: pgvector/pgvector:pg17
    container_name: fab-ops-db
    environment:
      POSTGRES_USER: fab
      POSTGRES_PASSWORD: fab
      POSTGRES_DB: fab_ops
    ports:
      - "55432:5432"  # host 5433 -> container 5432 (a local Postgres already uses 5432)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fab -d fab_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
